name: Windows CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh

jobs:
  build:
    name: Build and package x64
    runs-on: windows-2025-vs2026
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Verify recorded native SDK contract
        run: python tests/check_client_compatibility.py
      - name: Build native release
        run: |
          New-Item -ItemType Directory -Path release/ci/build -Force | Out-Null
          try { ./build-release.ps1 -Rebuild *> release/ci/build/build.log }
          catch { Get-Content release/ci/build/build.log -Tail 80; throw }
      - name: Verify languages, package and source provenance
        run: python tests/language_package_integrity.py --require-clean
      - name: Check loader CLI
        run: |
          & ./dist/phoenix/phoenix.exe --help
          if ($LASTEXITCODE -ne 0) { throw 'Loader help failed.' }
          & ./dist/phoenix/phoenix.exe --check
          if ($LASTEXITCODE -ne 0) { throw 'Loader file check failed.' }
          & ./dist/phoenix/phoenix.exe --unknown-option
          if ($LASTEXITCODE -ne 7) { throw 'Unknown options must fail without waiting for a game.' }
      - name: Upload verified package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: phoenix-windows-x64
          path: |
            dist/phoenix.zip
            dist/phoenix.zip.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-logs
          path: release/ci/build/*.log
          if-no-files-found: ignore
          retention-days: 14

  regression:
    name: ${{ matrix.suite }} regression
    runs-on: windows-2025-vs2026
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        suite: [Core, Gameplay, Graphics]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run regression suite
        run: ./tests/run-ci-suite.ps1 -Suite ${{ matrix.suite }}
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-logs-${{ matrix.suite }}
          path: release/ci/${{ matrix.suite }}/*.log
          if-no-files-found: ignore
          retention-days: 14
