# 自动开火依赖有效锁定及命中机会阈值。射速倍率仅对单机／本地主机即时枪械生效；远程服务器保留原生间隔，关闭后恢复。霰弹枪集中可以独立使用，自动换弹仍需弹药。相枪保持目标需按住左键，失效或遮挡时暂停；松开重新选择。水下枪械使用原生水下装备和开火标记，支持已加载即时枪械与泰克相枪，关闭时恢复；远程服务器决定实际扣弹、命中及伤害。
a8bfd6dc9be9123d="Auto fire requires a valid target and the hit-chance threshold. Fire-rate scaling applies only to instant-hit guns on a local host; remote servers keep their native interval. Disabling restores the interval. Shotgun convergence works independently; reloading requires ammunition. Hold the left button to retain a phase-pistol target; invalid or obscured targets pause tracking, and releasing selects again. Underwater mode uses native equip/fire flags for loaded instant-hit guns and the Tek Phase Pistol, restoring them when disabled. Remote servers still decide ammunition use, hits and damage."
# 骑乘采集与背包物资自动丢弃
1e2f4003c3364efc="Mounted harvesting and backpack resource drops"
# 先骑乘支持采集的生物，再启用并在资源筛选中选择目标。普通坐骑可自动靠近、疾跑、绕障和攻击；跨步者需要采集钻头头部配件。搜索半径不代表攻击距离。安全导航优先使用地面／碰撞探测，实验寻路并不保证所有地形可达。持续有收益时保持目标，无收益超时换点。菜单或失焦暂停，复杂地形请观察运行状态。自动丢弃为独立开关，可多选 11 类人物背包物资，逐组丢弃；排除快捷栏、已装备和蓝图，开启前存好需要保留的材料。未勾选类型不执行。
aea76843054d9a98="Mount a supported creature, enable harvesting and choose resource filters. Regular mounts can approach, sprint, avoid obstacles and attack; a Tek Stryder needs its harvesting drill head rig. Search radius is not attack range. Ground and collision checks take priority; experimental navigation cannot guarantee every route. A productive target is retained; an unproductive one times out. Menus and loss of focus pause operation. Watch difficult terrain. Auto drop is independent: select any of 11 backpack resource categories to discard whole stacks. Equipped items, hotbar items and blueprints are excluded. Store wanted materials first. Selecting no categories performs no drops."
# 笔记解锁每次运行一轮，可随时停止；奖励和经验 Buff 由服务器确认。上传锁定已加载范围内最近方尖碑，人物保持原位；面板打开时暂停其他自动容器操作，关闭后恢复客户端距离。服务器决定上传距离、冷却、远程访问和跨服权限；普通账号在其他服务器无法凭客户端面板获得全地图上传权限。不会自动重开关闭的面板。
9d9c5bb28ea5eea3="Each note-unlock run makes one pass and can be stopped; rewards and XP buffs require server confirmation. Upload selects the closest loaded obelisk while keeping the survivor in place. Other automatic container actions pause while its panel is open, and client distance settings are restored when it closes. The server controls upload distance, cooldowns, access and transfers. A normal account on another server cannot gain map-wide upload permission by opening a client panel. Closed panels are not reopened automatically."
# 附带活动计时器、返回位置标记和生命／氧气／负重提醒三个本地 Lua 工具，按需加载。默认 Ctrl+F6 暂停计时、Ctrl+Shift+F6 清零、Ctrl+F7 标记位置、Ctrl+Shift+F7 清除、Ctrl+F8 静音提醒。各脚本顶部 Settings 可修改按键、位置和阈值。只读取有效游戏快照，换图或死亡后旧位置清除。停止自动化不卸载脚本；在此关闭或卸载可停止脚本。只加载可信脚本。
94570ddb3bc1cb1f="Three local Lua tools are included for optional loading: a session timer, a return waypoint, and health/oxygen/weight reminders. Defaults: Ctrl+F6 pauses the timer, Ctrl+Shift+F6 resets it, Ctrl+F7 marks a position, Ctrl+Shift+F7 clears it, and Ctrl+F8 mutes reminders. Edit Settings at the top of each script to change keys, positions and thresholds. Tools read valid session snapshots; old waypoints clear on map changes or death. Stop Automation does not unload scripts; disable or unload them here. Only load trusted scripts."
# 调整菜单字号和窗口大小，锁定布局可防止误拖动尺寸。悬停说明和启动展示偏好随配置保存。说明仅在光标停留于功能上时显示，页面、菜单和调色板使用短暂淡入淡出。重置布局将窗口移回屏幕并恢复默认字号。窄窗口自动将导航折叠为选择框，参数区保持可滚动。
