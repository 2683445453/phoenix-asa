adef003296d95aa7="Host reload duration adjustment (experimental)"
8043a15d693e8773="Tek grenade launcher read-only diagnostics"
c2b5159f6b1aa9b2="Adjusts reload duration fields on the host only; actual reload behavior still needs verification. Does not automatically refill the clip. Remote instant reload is unavailable and keeps native behavior. The Tek grenade launcher supports read-only diagnostics only."
e890044940aba4a4="Tek grenade launcher: read-only slot diagnostics. Instant reload is unavailable; native behavior is preserved."
cdb8aea30921a2cf="Remote instant reload is unavailable: the server controls loading. No clip changes or automatic reload requests."
d81d2c691de0e47d="Host reload duration fields are zeroed; actual reload behavior needs verification. Native ammo consumption is preserved."
f1a505c050495530="Reload duration patch is inactive; native behavior is preserved."
286ba94783cdbd8b="Local flight could not start. Keep the current state available for diagnosis."
# Interface, feature guides and runtime messages. Keep keys; edit quoted UTF-8 values.
# 常用功能
bec88f166df43bd5="Favorites"
# 战斗辅助
e40dd1b5bfbeba77="Combat"
# 透视显示
09ce37692a651969="Visuals"
# 资源采集
e093d65121c4d00f="Harvesting"
# 自动化
027218ff42e9956c="Automation"
# 工具
eedffdd3662b052b="Tools"
# 设置
df5abec9c87e70b3="Settings"
# 控制中心
d96c7ecaa31c9cb7="Control Center"
# 常用入口与运行中的功能
95027d1a5abc4c29="Quick access and active features"
# 点击功能名称进入详细设置；关闭开关会隐藏子参数但保留数值。停止自动化会关闭自动输入、移动、容器操作及战斗辅助，保留透视和参数，不自动恢复。具体服务器效果需以实际反馈为准。
68eb36a00e232074="Select a feature to see its settings. Switching it off hides its parameters and preserves their values. Stop Automation turns off automated input, movement, inventory actions and combat assistance, while keeping visuals and parameters. Features do not restart automatically. Actual effects depend on the server."
# 自动锁定
b36d76efb12db420="Target Lock"
# 目标类型、锁定部位与弹道预判
a2f04add026f5f71="Target types, aim points and projectile prediction"
# 按圆内头／身体到圆心的距离选择目标，镜头由你控制。玩家、野生、驯养生物和 Boss 分别筛选；头／身体都关闭将停止锁定。锁定不扩大武器射程，遮挡时保留目标但暂停修正。投射物预判读取弹速、重力、蓄力和目标速度；延迟单位为 ms，时间单位为 s。范围增大仅扩展候选搜索，无法读取未加载对象。
4d6bcd0cf87b82fe="Targets are selected by the distance from their head or body to the center of the aim circle; you control the camera. Filter players, wild creatures, tames and bosses separately. Disabling both head and body stops targeting. Locking does not extend weapon range. Obstructed targets remain selected but aim correction pauses. Projectile prediction uses velocity, gravity, charge and target motion. Delay is in ms and time is in seconds. Increasing range expands the search among loaded objects only."
# 枪械与射击
47c158a22a9db133="Weapons & Shooting"
# 射速、自动开火与霰弹枪
8cb1186a74dc66c5="Fire rate, triggerbot and shotguns"
# 自动开火依赖有效锁定及命中机会阈值。射速倍率仅对单机／本地主机即时枪械生效；远程服务器保留原生间隔，关闭后恢复。霰弹枪集中可以独立使用，自动换弹仍需弹药。相枪保持目标需按住左键，失效或遮挡时暂停；松开重新选择。
1b62b47e9002d0e9="Automatic fire requires a valid target and the minimum hit chance. Fire-rate multipliers apply immediately to hitscan weapons on standalone or local-host games; remote servers keep their native intervals. Disabling restores the original interval. Shotgun convergence works independently; automatic reload still needs ammunition. Hold the left mouse button to keep a phase-pistol target. Correction pauses when obstructed or invalid; release to select again."
# 锁定指示
fa908b9fed5df63c="Target Indicators"
# 范围圆、连线、标记与目标信息
868208bbde5e58ee="Aim circle, lines, markers and target information"
# 锁定圆按屏幕短边百分比计算；隐藏圆不会改变选取范围。连线、标记和目标信息分别开关，线宽及大小单位为像素。长矛与自动锁定共用圆大小、线宽和信息字号，显示开关各自保存。
232d35fa52842bf5="The aim circle uses a percentage of the screen's shorter dimension. Hiding it does not change target selection. Lines, markers and target information have separate switches; line widths and sizes are in pixels. The spear has its own circle size, line width and information font size. Display and color preferences are saved independently."
# 泰克长矛
debb6529580221af="Tek Spear"
# 近战招架与飞行物偏转
d0244fddfd382afd="Melee parry and projectile deflection"
# 从锁定圆内选最近的 1–5 个有效敌方单位，分别跟踪攻击时机；自动朝向攻击者后回正，保留鼠标转向。近战提前时间与右键短按时长以秒计。需要默认右键／左 Shift、可用耐久和能量；手动右键优先。飞行物偏转按接近轨迹与遮挡判断，瞬时射线不可提前识别。同时来自不同方向的攻击不保证全部挡住。菜单、背包、聊天、失焦、换武器会释放自动输入。
80c4ea530f2d13ac="Tracks attacks from the nearest 1-5 eligible enemies inside the targeting circle. Automatic facing returns to the previous view and preserves mouse movement. Parry lead time and right-click tap duration are in seconds. Requires the default right mouse / left Shift bindings, durability and energy. Manual right-click takes priority. Projectile deflection considers approach trajectory and obstructions; hitscan attacks cannot be detected in advance. Simultaneous attacks from different directions may not all be blocked. Opening menus, inventory or chat, losing focus or changing weapons releases synthetic input."
# 对象与模型
24884a5c750d81ab="Objects & Models"
# 玩家、生物、模型及信息开关
5920ef30653840a6="Players, creatures, models and information layers"
# 玩家、生物、建筑为对象筛选，模型、方框、名称、距离、生命、眩晕和尸体信息分别启用。模型使用原生阵营颜色；信息支持敌方／友军独立颜色。模型距离与建筑距离同时限制建筑模型。眩晕及尸体信息只用于人物和生物。颜色只影响显示；低透明度可能降低可读性。
8a03e34f0e6fecd5="Players, creatures and teammates have separate filters. Configure models, boxes, names, distance, health, torpor and corpse information individually. Models use native team colors; information colors can be set for enemies and allies. Building models are limited by both model distance and building filters. Torpor and corpse details appear only where applicable. Colors affect display only; low opacity can reduce readability."
# 信息排版
73caf79e0a5525c5="Information Layout"
# 字号、缩放与防重叠
2fd275e9500b7d3d="Font size, spacing and overlap reduction"
# 名称、距离与状态条按目标组合。防重叠优先保留锁定目标和近处对象，无法找到空位时整组隐藏。字号上限 48px；最小字号不得大于信息字号。距离缩放可以单独关闭。较大字号使可显示的对象数量减少。
1f59c2c4accacae7="Names, distance and status are grouped above targets. Overlap reduction favors nearby targets and important warnings, hiding information when no space is available. Font size is capped at 48 px; minimum size cannot exceed the main size. Distance scaling can be disabled separately. Larger text leaves room for fewer objects."
# 建筑筛选
c3334745825eb1ef="Building Filters"
# 物品与环境
3de95cfb50ee2d51="Items & Environment"
# 掉落物、水源、视野外威胁
e2b45530ad2abd1a="Dropped items, water and off-screen threats"
# 掉落物按类型过滤，并可分别配色。水源只显示已加载范围内的指定数量。视野外箭头按屏幕半径和威胁距离提示方位；透明度可调，默认保持静态显示。掉落物筛选可被自动拾取共用。
924f14f382b08720="Filter and color dropped-item categories separately. Water markers cover specified water sources within loaded areas. Off-screen arrows use a screen-relative radius. Threat-alert placement and opacity are adjustable; indicators are static by default. Automatic pickup can reuse dropped-item filters."
# 骑乘自动采集
d04c509e90bdf209="Mounted Harvesting"
# 普通坐骑与泰克跨步者
38137970407cc441="Standard mounts and Tek Stryders"
# 先骑乘支持采集的生物，再启用并在资源筛选中选择目标。普通坐骑可自动靠近、疾跑、绕障和攻击；跨步者需要采集钻头头部配件。搜索半径不代表攻击距离。安全导航优先使用地面／碰撞探测，实验寻路并不保证所有地形可达。持续有收益时保持目标，无收益超时换点。菜单或失焦暂停，复杂地形请观察运行状态。
7a092a3521ea6f9d="Ride a supported creature and select resource filters. Standard mounts approach targets with sprint, climbing and attack controls. Stryders need the harvesting head rig; beam radius is not navigation distance. Safe-approach checks use ground and collision probes and do not guarantee access across all terrain. Targets with no yield are temporarily skipped and retried later. Menus or lost focus pause input. View status messages when several filters are combined."
# 资源筛选与高亮
f401fa940fa8480d="Resource Filters & Markers"
# 矿物类型、距离及名称
fc2948ec164a1328="Deposit types, distances and colors"
# 金属、水晶、黑曜石、石油、珍珠和元素碎片分别筛选与配色。筛选由高亮与自动采集共享，因此即使高亮关闭也可修改类型。资源模型与名称开关依赖资源高亮；关闭高亮会隐藏这些子参数，采集仍使用所选类型。只能识别已扫描到的资源。
5bb2ce48f25141ac="Filter and color metal, crystal, obsidian, oil, pearls and element shards separately. Mounted harvesting shares these type filters, so they remain editable with highlighting disabled. Resource models and name markers have independent display controls. Disabling highlighting hides its parameters but harvesting keeps the selected types. Only scanned resources can be identified."
# 扫描诊断
c2979245252a5923="Scan Diagnostics"
# 资源识别和渲染通道状态
853ec73764f5919e="Resource recognition and render-path status"
# 查看已扫描关卡、Actor、实例及模型数量，以及描边和相机通道状态。扫描数不等于可采集数；接口未匹配时请保留诊断信息用于排查。这里不会开启额外采集操作。
1d7a81e3be43aeec="Shows scanned levels, actors, instances and models, plus outline and color-path status. Scan counts are not counts of harvestable targets. Keep this information when reporting an unmatched interface. This page does not start extra harvesting actions."
# 拾取与吸包
518492a19db648a1="Pickup & Loot"
# 生存补给
d1952215af088ec4="Survival Supplies"
# 进食、饮水、医疗、增益汤与灭火
8a243f197cbc1148="Food, water, medicine, buff soups and fire control"
# 低于阈值时尝试使用背包里适用的食物、水或药剂；增益汤可勾选类型并在 buff 消失后自动补续，身体着火会自动向脚下投掷灭火手雷。需要实际物品并遵守原生使用条件及冷却；无法使用时查看状态。每项可以独立关闭，关闭后保留阈值。
e44384fb96334305="Attempts to use suitable food, water or brews below the thresholds; buffing soups can be selected per type and are re-consumed when their buff expires, and a fire-extinguishing grenade is thrown at your feet while burning. Requires actual items and follows native use conditions and cooldowns. Check the status when an item cannot be used. Each feature can be disabled independently without losing its values."
# 钓鱼助手
77f6757d87ac394b="Fishing Assistant"
# QTE、重新抛竿与鱼竿维护
fc4d4f878bb14963="QTE, recasting and rod maintenance"
# 装备可用鱼竿并进入原生钓鱼流程后自动处理 QTE；重新抛竿依赖 QTE 开关。自动更换鱼竿和回收鱼饵为独立开关。需要备用鱼竿及鱼饵，不能绕过原生钓鱼条件。失焦或打开界面暂停输入。可独立开启背包蓝图自动转入附近保险箱，包含已有蓝图，不转移已学习的印痕。容器需要在可访问距离内并有权限及容量。
8271acc6ce6bec1f="Equip a usable rod and start native fishing to automate QTE input. Recasting depends on the QTE switch. Rod replacement and bait recovery are independent and require spare rods or bait. Native fishing conditions still apply. Lost focus or open interfaces pause input. A separate option deposits physical backpack blueprints, including existing ones, into nearby vaults; learned engrams are excluded. Containers need to be in accessible range with permission and capacity."
# 嘎查水晶
3cccd2aa0cdeccab="Gacha Crystals"
# 开启、补充与研磨机转移
9698c8b85ed02b26="Opening, restocking and grinder deposits"
# 每批最多 32 颗，按设置的整批间隔持续处理；已请求而未同步的水晶不会立即重复提交，待同步数量有上限。可在背包清空后从附近可访问保险箱补充。服务器决定实际速度；更短间隔不保证更高收益。关闭开水晶开关会停止开启及取水晶流程。装备和建筑转入研磨机是独立开关，支持原版与 QoL+，包含背包已有物品；开启前先存好贵重物品。已装备、快捷栏、蓝图和皮肤不会转入，不检查收藏，不自动研磨。
55a8dc06d167ca07="Opens up to 32 crystals per batch at the configured batch interval. Pending uses are bounded and are not immediately resent before synchronization. Nearby accessible vaults can restock an empty backpack. Actual speed is server-controlled; shorter intervals do not guarantee more rewards. Disabling crystal opening stops opening and restocking. Grinder deposits are independent, support vanilla and QoL+, and include existing gear and structures. Store valuables first. Equipped items, hotbar items, blueprints and skins are excluded. Favorites are not checked. Grinding is not automated."
# 自动制作
01bcb2c1417b0a5d="Auto Craft"
# 选择工作台、配方与队列
c2339f9ddd416bf5="Workstations, recipes and queues"
# 开启后先选择范围内的工作台和配方；可按名称搜索。持续补充制作队列，每批最多 100，为缓冲数量。需要材料、权限及运行条件；缺料或离开范围时等待，恢复后继续。关闭停止补单，已经提交到原生工作台的任务不会撤销。上传面板和手动容器会话优先。
cf4d865d658096c7="Enable the feature and select a nearby workstation and recipe. Search by name. The queue is replenished with a buffer of up to 100 per batch. Materials, permissions and operating conditions are required. Missing materials or leaving range pauses requests; they resume when conditions return. Disabling stops new requests but does not cancel jobs already queued in the native workstation. Upload panels and manual container sessions take priority."
# 自动维修
514bafbf889fabe8="Auto Repair"
# 耐久阈值、检查间隔与范围
d65547f20425b53e="Durability threshold, check interval and scope"
# 装备耐久低于阈值时尝试原生维修，可包含背包物品。需要实际材料和可维修条件，部分物品仍要求工作台。间隔单位秒；提高阈值会更早尝试维修。关闭不会消耗更多材料或改变已完成维修。
ea0b7b960dba0b69="Attempts native repairs below the durability threshold, optionally including backpack items. Requires materials and valid repair conditions; some items still need a workstation. Intervals are in seconds. Higher thresholds trigger earlier repairs. Disabling prevents new repair requests without changing completed repairs."
# 喂养与治疗
8421f2642825344a="Feeding & Healing"
# 附近生物喂养及凶齿豨治疗
86a6d4bac7c3f047="Nearby creature feeding and Daeodon healing"
