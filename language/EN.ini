08b7d35bf5f0c3a2="Automatic feeding filters creatures by range, interval and name and requires food and access. An empty name filter accepts all names. The Daeodon button sends one enable request; actual healing follows food and native rules. Stop Automation disables feeding but does not turn off creature healing already enabled in the game."
