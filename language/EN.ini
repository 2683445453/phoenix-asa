3dc0c24efd250847="Note unlocks run one pass and can be stopped at any time; the server confirms rewards and XP buffs. Upload access selects the nearest loaded obelisk while the survivor stays in place. Other automated container actions pause while the panel is open. Closing restores client-side distance settings. The server determines upload cooldowns, remote access and cluster permissions. Closed panels are not reopened automatically."
