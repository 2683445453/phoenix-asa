# 坐骑转向、护甲和本地自由飞行
fa8f7696c86ce80b="Mount turning, armor and local free camera"
# 坐骑飞行与强制转向受当前生物和接口支持限制。护甲自动替换需背包中有合适装备。灵魂出窍需先下坐骑，仅移动本地相机，无需管理员权限。开启后双击空格进入／退出，WASD 移动、空格上升、Ctrl 下降、Shift 临时加速、鼠标转向，Esc 返回人物视角。开关开启时空格保留给双击与相机上升，关闭后恢复普通跳跃。菜单、聊天、背包、失焦、死亡、骑乘及人物或世界切换时退出并恢复视角与输入。相机不会改变人物位置，人物仍受重力、碰撞和伤害影响；速度不扩大建造或交互权限。快速重生依赖原生重生条件。
c60d8c5465456595="Mount flight and forced turning depend on the current creature and supported interfaces. Armor replacement requires suitable backpack equipment. Dismount before using Free Camera. It moves only your local view and needs no administrator permission. Enable it, then double-tap Space to enter or exit. Use WASD to move, Space to rise, Ctrl to descend, Shift to accelerate temporarily and the mouse to look around. Esc returns to the survivor view. While the feature switch is on, Space is reserved for double-tapping and camera ascent; switch it off to restore normal jumping. Menus, chat, inventory, focus loss, death, mounting, or a character or world change exits and restores the view and input. Camera motion does not move the survivor, who remains subject to gravity, collisions and damage. Speed does not extend building or interaction permissions. Fast respawn still follows native respawn conditions."
# 笔记与上传
