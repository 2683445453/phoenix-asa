b993cfee6e04aa74="Click a binding and press the desired combination. Esc cancels; Clear removes a feature binding. Supports Ctrl / Alt / Shift with letters, numbers, function keys or navigation keys. Conflicts are rejected and identified. Menu and Stop bindings cannot be empty. Feature shortcuts trigger once only with the game in the foreground and no menu, chat or inventory input. Holding a key does not repeat. Stop works inside interfaces and disables built-in automation without restarting it."
